# Machine roster — Sridhar Precision Works
#
# SOURCE FACT (assignment brief): "14 machines (CNC lathes, milling machines, drills, and
# one grinding machine that every job seems to need)."
#
# The 14 machines below are trimmed to exactly those families. GRINDER_01 is deliberately
# singular — it is the shop-wide bottleneck the brief calls out by name.
#
# hourly_rate_inr values are DERIVED DECISIONS (see ECONOMICS.md) — plausible for a
# tier-2 Indian auto-components shop in 2026, not sourced from the brief.
#
# mtbf_hours / mttr_hours are ASSUMPTIONS used to generate a plausible breakdown history
# (deterministic, seed=42) and to score the "Robust" strategy. GRINDER_01 is given a lower
# MTBF than comparable machines to reflect it being the shop's single point of failure —
# every job needs it, so its condition matters more.

machines:
  - machine_id: CNC_LATHE_01
    name: "CNC Lathe #1 (Small, 2-axis)"
    machine_type: CNC_LATHE
    hourly_rate_inr: 550
    capabilities: [TURNING, FACING, THREADING]
    mtbf_hours: 720
    mttr_hours: 6

